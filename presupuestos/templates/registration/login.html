{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesion - Presupuestos AP</title>
<style>
  :root {
    --verde: #035953;
    --verde-oscuro: #023f3b;
    --texto: #2d2d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top left, #0a6f68 0%, var(--verde) 45%, var(--verde-oscuro) 100%);
    color: var(--texto);
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    max-width: 380px;
    width: 100%;
    padding: 40px 36px;
    text-align: center;
  }
  .logo { width: 100px; height: auto; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 24px; color: var(--verde-oscuro); }
  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--verde); }
  .btn {
    width: 100%;
    background: var(--verde);
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:hover { background: var(--verde-oscuro); }
  .errores { color: #ba2121; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="{% static 'presupuestos/img/logo.png' %}" alt="Fonda Argentina">
    <h1>Presupuestos AP - Sucursales</h1>
    {% if form.errors %}
      <div class="errores">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
